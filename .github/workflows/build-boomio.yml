name: Build Boomio mobile release

# Weekly Boomio build for Android.
#
# Unlike the TV fork there is no upstream *stable tag* to track: NuvioMobile publishes
# `-beta` releases roughly every day or two, and they are not flagged as pre-releases, so
# `releases/latest` would resolve to whatever shipped this morning. We therefore track the
# upstream BRANCH and let the weekly cadence decide how much upstream churn to absorb.
# Set `upstream_ref` on a manual dispatch to pin to a specific tag when you want to freeze.
#
# Modelled on BoomioTV's build-boomio.yml, with the same core guarantee: if upstream cannot
# be merged cleanly the run FAILS and opens an issue rather than silently rebuilding the
# previous base.
#
# Deliberately does NOT reuse upstream's scripts/release-metadata.sh: that script enforces
# upstream's "the version bump is the last commit" discipline and refuses when the tag
# already exists, both of which fight a fork that rebuilds an upstream version.

on:
  schedule:
    # Weekly, Monday, off the hour so we don't pile onto the top-of-hour API rush.
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream ref to merge (branch or tag). Blank = the tracked branch.
        required: false
        type: string
      mode:
        description: dry-run builds only; publish also creates the fork release
        required: true
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run
      force:
        description: Rebuild even if a release for this version already exists
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: boomio-mobile-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: NuvioMedia/NuvioMobile
  UPSTREAM_BRANCH: cmp-rewrite
  BOOMIO_BRANCH: boomio
  FLAVOR: boomio
  # composeApp picks its Android distribution from a gradle property, and an aggregate
  # assemble task hard-fails when it is unset (composeApp/build.gradle.kts). `boomio` in
  # androidApp reuses the `full` composeApp distribution.
  ANDROID_DISTRIBUTION: full

jobs:
  build:
    name: Build Boomio mobile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BOOMIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.BOOMIO_RELEASE_KEYSTORE_BASE64 }}
      BOOMIO_RELEASE_KEY_ALIAS: ${{ secrets.BOOMIO_RELEASE_KEY_ALIAS }}
      BOOMIO_RELEASE_KEY_PASSWORD: ${{ secrets.BOOMIO_RELEASE_KEY_PASSWORD }}
      BOOMIO_RELEASE_STORE_PASSWORD: ${{ secrets.BOOMIO_RELEASE_STORE_PASSWORD }}
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      # Dispatch inputs reach shell only through the environment.
      UPSTREAM_REF_INPUT: ${{ github.event.inputs.upstream_ref }}
      # A scheduled run is the "ship it" path, so it publishes. A manual run defaults to
      # dry-run and has to opt in.
      MODE: ${{ github.event.inputs.mode || 'publish' }}
      FORCE: ${{ github.event.inputs.force || 'false' }}

    steps:
      - name: Check out the Boomio branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BOOMIO_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve the upstream ref
        id: upstream
        run: |
          ref="${UPSTREAM_REF_INPUT}"
          if [[ -z "${ref}" ]]; then
            ref="${UPSTREAM_BRANCH}"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved upstream ref: ${ref} (branch ${UPSTREAM_BRANCH})"

      - name: Merge upstream into the Boomio branch
        id: merge
        env:
          REF: ${{ steps.upstream.outputs.ref }}
        run: |
          set -euo pipefail
          git config user.name  "boomio-bot"
          git config user.email "boomio-bot@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "${REF}"

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Upstream ${REF} is already merged; building as-is."
            echo "conflict=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git merge --no-edit FETCH_HEAD; then
            echo "conflict=false" >> "${GITHUB_OUTPUT}"
          else
            files="$(git diff --name-only --diff-filter=U | head -50 || true)"
            git merge --abort || true
            {
              echo "conflict=true"
              echo "files<<EOF"
              echo "${files}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      # Issues are currently DISABLED on this fork, so the gh issue calls below cannot
      # succeed and are best-effort — the run's real signal is the non-zero exit and the
      # ::error:: annotation, which surface regardless. If issues are ever enabled, this
      # starts filing/updating an `upstream-sync` issue on its own with no further change.
      - name: Report a merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          REF: ${{ steps.upstream.outputs.ref }}
          CONFLICT_FILES: ${{ steps.merge.outputs.files }}
        run: |
          set -euo pipefail
          title="Upstream ${REF} needs a manual merge"
          body="$(printf 'Merging upstream `%s` into `%s` conflicted, so no build was attempted.\n\nConflicting files:\n\n```\n%s\n```\n\nResolve on the branch, then re-run this workflow.\n' "${REF}" "${BOOMIO_BRANCH}" "${CONFLICT_FILES}")"
          gh label create upstream-sync --color BFD4F2 --description "Upstream sync needs a human" --force || true
          existing="$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty' || true)"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "${body}" || true
          else
            gh issue create --title "${title}" --body "${body}" --label upstream-sync || true
          fi
          echo "::error::Upstream merge conflicted; see the upstream-sync issue."
          exit 1

      - name: Push the merge
        if: steps.merge.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          git config user.name  "boomio-bot"
          git config user.email "boomio-bot@users.noreply.github.com"
          if git diff --quiet "origin/${BOOMIO_BRANCH}..HEAD"; then
            echo "Nothing to push."
          else
            git push origin "HEAD:${BOOMIO_BRANCH}"
          fi

      # The app version is shared with iOS and lives in one xcconfig; androidApp reads it
      # at configure time and FAILS the build if it is missing, so read it the same way.
      - name: Read the app version
        id: version
        run: |
          set -euo pipefail
          f="iosApp/Configuration/Version.xcconfig"
          [[ -f "${f}" ]] || { echo "Missing ${f}" >&2; exit 1; }
          name="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*(.+)$/\1/p' "${f}" | tail -1 | tr -d '[:space:]')"
          code="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*(.+)$/\1/p' "${f}" | tail -1 | tr -d '[:space:]')"
          [[ -n "${name}" && -n "${code}" ]] || { echo "Could not parse version from ${f}" >&2; exit 1; }
          # The tag MUST be a bare `X.Y.Z`. The in-app updater parses it with an anchored
          # semver regex (VersionUtils.parse) and DROPS any release it cannot parse, so a
          # decorated tag like `boomio-0.5.3-135` makes every future update invisible to
          # the app -- silently, with no error surfaced anywhere.
          #
          # Appending the build code is not an option either: semver reads `0.5.3-135` as a
          # PRERELEASE, and the STABLE channel filters prereleases out. Build metadata
          # (`0.5.3+boomio.135`) would parse, but semver ignores it when comparing, so the
          # updater would never treat a rebuild as newer -- and the skip-if-released guard
          # below would, which is the mismatch we are avoiding.
          #
          # Bare `X.Y.Z` is free: upstream tags every 0.5.x as `-beta`, and the fork's
          # inherited bare tags stop at 0.4.13.
          tag="${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Version ${name} (${code}) -> release tag ${tag}"

      - name: Skip if this version is already released
        id: guard
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ "${FORCE}" == "true" || "${MODE}" != "publish" ]]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Java
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.guard.outputs.proceed == 'true'
        # `gradle/actions`, not `actions/gradle` -- the latter does not exist, and the
        # job dies at "Set up job" with "Unable to resolve action" before any step runs.
        uses: gradle/actions/setup-gradle@v6

      - name: Configure signing and build properties
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${BOOMIO_RELEASE_KEYSTORE_BASE64}" ]] || missing+=("BOOMIO_RELEASE_KEYSTORE_BASE64")
          for name in BOOMIO_RELEASE_KEY_ALIAS BOOMIO_RELEASE_KEY_PASSWORD BOOMIO_RELEASE_STORE_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          # A publish run must not ship an APK built without its build-time config.
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" && "${MODE}" == "publish" ]]; then
            missing+=("LOCAL_PROPERTIES_BASE64")
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/boomio-release.jks"
          printf '%s' "${BOOMIO_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          # androidApp/build.gradle.kts resolves these env-first (envOrLocalProperty),
          # so signing needs no local.properties surgery.
          {
            echo "NUVIO_RELEASE_STORE_FILE=${keystore_path}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${BOOMIO_RELEASE_KEY_ALIAS}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${BOOMIO_RELEASE_KEY_PASSWORD}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${BOOMIO_RELEASE_STORE_PASSWORD}"
          } >> "${GITHUB_ENV}"

          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

            # sdk.dir would point at the machine that generated the blob. The NUVIO_RELEASE_*
            # lines are stripped even though androidApp reads the environment first, so a
            # stale keystore path can never win over the one this run just decoded.
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_[A-Z_]+)[[:space:]]*=/d' local.properties

            # Trakt and Simkl client ids are compiled into BuildConfig straight from
            # local.properties with no environment fallback, so an absent key does not fail
            # the build -- it ships an APK whose login buttons cannot work.
            required_properties=(TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET)
            absent=()
            for property_name in "${required_properties[@]}"; do
              grep -Eq "^[[:space:]]*${property_name}=.+" local.properties || absent+=("${property_name}")
            done
            if (( ${#absent[@]} > 0 )); then
              printf 'local.properties is missing required keys: %s\n' "${absent[*]}" >&2
              exit 1
            fi
            grep -Eq "^[[:space:]]*SIMKL_CLIENT_ID=.+" local.properties \
              || echo "::warning::SIMKL_CLIENT_ID is absent; Simkl login will be unavailable."
          else
            echo "::warning::LOCAL_PROPERTIES_BASE64 is not set; build-time config will use defaults."
          fi

      - name: Build the Boomio flavor
        if: steps.guard.outputs.proceed == 'true'
        run: |
          ./gradlew :androidApp:assembleBoomioRelease \
            -Pnuvio.android.distribution="${ANDROID_DISTRIBUTION}" \
            --stacktrace

      - name: Upload the APKs
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: boomio-${{ steps.version.outputs.tag }}-release
          path: androidApp/build/outputs/apk/boomio/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the fork release
        if: steps.guard.outputs.proceed == 'true' && env.MODE == 'publish'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find androidApp/build/outputs/apk/boomio/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No APKs were produced." >&2
            exit 1
          fi

          # A forced run reaches here with the release already created, so re-upload
          # instead of letting `gh release create` fail with a 422 after a full build.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --clobber "${apks[@]}"
            echo "Re-uploaded the APKs to the existing release ${TAG}."
            exit 0
          fi

          {
            echo "Boomio Android build of upstream \`${UPSTREAM_REPO}\` at \`$(git rev-parse --short HEAD)\`."
            echo
            echo "Application id \`com.boomio.mobile\`, signed with the Boomio release key, so it installs alongside the official Nuvio app."
            echo
            echo "App version ${VERSION_NAME} (${VERSION_CODE}). Per-ABI APKs; pick the one matching the device."
            echo
            echo "Built from \`${BOOMIO_BRANCH}\`."
          } > boomio-notes.md

          gh release create "${TAG}" \
            --target "$(git rev-parse HEAD)" \
            --title "Boomio mobile ${VERSION_NAME}" \
            --notes-file boomio-notes.md \
            "${apks[@]}"
